name: Update GitHub Profile

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
profile:
name: Update profile assets
runs-on: ubuntu-latest

```
steps:
  - name: Checkout profile repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Generate contribution snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        github-snake.svg
        github-snake-dark.svg?palette=github-dark

  - name: Generate GitHub metrics
    uses: lowlighter/metrics@latest
    with:
      token: ${{ secrets.GITHUB_TOKEN }}
      filename: github-metrics.svg
      base: header, activity, community, repositories, metadata
      config_timezone: Asia/Ho_Chi_Minh
      config_display: large

  - name: Commit generated assets
    run: |
      git config --local user.name "github-actions[bot]"
      git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add github-snake.svg
      git add github-snake-dark.svg
      git add github-metrics.svg

      git diff --cached --quiet || git commit -m "chore: update profile assets [skip github action]"

      git push
```
