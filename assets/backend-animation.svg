<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="50%" stop-color="#7A00FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#7A00FF"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A00FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes flowData {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkLed {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes scanline {
        0% { transform: translateY(-10px); opacity: 0; }
        50% { opacity: 0.2; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: flowData 1.2s linear infinite;
      }
      .led-green {
        animation: blinkLed 1.4s ease-in-out infinite;
      }
      .led-cyan {
        animation: blinkLed 1s ease-in-out infinite 0.3s;
      }
      .led-magenta {
        animation: blinkLed 1.8s ease-in-out infinite 0.6s;
      }
      .scanner {
        animation: scanline 4s linear infinite;
      }
      .title-text {
        font-family: 'JetBrains Mono', 'Segoe UI', monospace;
        font-weight: 700;
      }
      .body-text {
        font-family: 'JetBrains Mono', 'Segoe UI', monospace;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="166" rx="12" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.8"/>

  <!-- Scanner effect -->
  <line x1="10" y1="0" x2="840" y2="0" stroke="#00C9FF" stroke-width="1.5" class="scanner"/>

  <!-- Card Top Header -->
  <g transform="translate(20, 24)">
    <circle cx="6" cy="0" r="4" fill="#FF5F56"/>
    <circle cx="20" cy="0" r="4" fill="#FFBD2E"/>
    <circle cx="34" cy="0" r="4" fill="#27C93F" class="led-green"/>
    <text x="50" y="4" fill="#ABB2BF" class="title-text" font-size="12">⚡ HIGH-CONCURRENCY BACKEND PIPELINE</text>
    <text x="730" y="4" fill="#00C9FF" class="title-text" font-size="11" text-anchor="end">LIVE ARCHITECTURE</text>
    <circle cx="742" cy="0" r="3.5" fill="#00C9FF" class="led-cyan"/>
  </g>

  <!-- Connection Lines with Animated Flow -->
  <g stroke-width="2">
    <path d="M 140 78 L 195 78" stroke="#00C9FF" class="flow-line"/>
    <path d="M 335 78 L 385 78" stroke="#7A00FF" class="flow-line"/>
    <path d="M 525 78 L 575 78" stroke="#FF007A" class="flow-line"/>
    <path d="M 715 78 L 745 78" stroke="#00C9FF" class="flow-line"/>
  </g>

  <!-- Moving Data Packets -->
  <circle r="3.5" fill="#00C9FF" filter="url(#glow)">
    <animateMotion path="M 140 78 L 195 78" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#7A00FF" filter="url(#glow)">
    <animateMotion path="M 335 78 L 385 78" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#FF007A" filter="url(#glow)">
    <animateMotion path="M 525 78 L 575 78" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Pipeline Nodes -->
  <!-- 1: Client -->
  <g transform="translate(25, 52)">
    <rect width="115" height="52" rx="8" fill="#161b22" stroke="#00C9FF" stroke-width="1.2"/>
    <text x="57" y="24" fill="#E6EDF3" class="title-text" font-size="11" text-anchor="middle">🌐 CLIENT</text>
    <text x="57" y="40" fill="#00C9FF" class="body-text" font-size="10" text-anchor="middle">HTTP / REST</text>
    <circle cx="103" cy="12" r="3" fill="#27C93F" class="led-green"/>
  </g>

  <!-- 2: Gin Gateway -->
  <g transform="translate(195, 50)">
    <rect width="140" height="56" rx="8" fill="#161b22" stroke="url(#cyanPurple)" stroke-width="1.5"/>
    <text x="70" y="22" fill="#E6EDF3" class="title-text" font-size="12" text-anchor="middle">🦫 GIN GATEWAY</text>
    <text x="70" y="38" fill="#61AFEF" class="body-text" font-size="10" text-anchor="middle">Go Concurrency</text>
    <text x="70" y="49" fill="#98C379" class="body-text" font-size="9" text-anchor="middle">Pool • Low Latency</text>
    <circle cx="128" cy="12" r="3" fill="#00C9FF" class="led-cyan"/>
  </g>

  <!-- 3: Database & Cache -->
  <g transform="translate(385, 50)">
    <rect width="140" height="56" rx="8" fill="#161b22" stroke="url(#purplePink)" stroke-width="1.5"/>
    <text x="70" y="22" fill="#E6EDF3" class="title-text" font-size="12" text-anchor="middle">🗄️ DATA LAYER</text>
    <text x="70" y="38" fill="#ABB2BF" class="body-text" font-size="10" text-anchor="middle">PostgreSQL + Redis</text>
    <text x="70" y="49" fill="#E5C07B" class="body-text" font-size="9" text-anchor="middle">Cache-Aside • ACID</text>
    <circle cx="128" cy="12" r="3" fill="#FF007A" class="led-magenta"/>
  </g>

  <!-- 4: Event Broker -->
  <g transform="translate(575, 50)">
    <rect width="140" height="56" rx="8" fill="#161b22" stroke="url(#cyanPurple)" stroke-width="1.5"/>
    <text x="70" y="22" fill="#E6EDF3" class="title-text" font-size="12" text-anchor="middle">📨 EVENT BROKER</text>
    <text x="70" y="38" fill="#ABB2BF" class="body-text" font-size="10" text-anchor="middle">Kafka / RabbitMQ</text>
    <text x="70" y="49" fill="#FF007A" class="body-text" font-size="9" text-anchor="middle">Async Pub-Sub</text>
    <circle cx="128" cy="12" r="3" fill="#27C93F" class="led-green"/>
  </g>

  <!-- 5: Workers -->
  <g transform="translate(745, 52)">
    <rect width="85" height="52" rx="8" fill="#161b22" stroke="#00C9FF" stroke-width="1.2"/>
    <text x="42" y="24" fill="#E6EDF3" class="title-text" font-size="11" text-anchor="middle">⚡ WORKERS</text>
    <text x="42" y="40" fill="#98C379" class="body-text" font-size="10" text-anchor="middle">Goroutines</text>
    <circle cx="75" cy="12" r="3" fill="#00C9FF" class="led-cyan"/>
  </g>

  <!-- Status Bar -->
  <g transform="translate(20, 142)">
    <rect width="810" height="18" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="13" fill="#27C93F" class="body-text" font-size="10">● SYSTEM HEALTHY</text>
    <text x="135" y="13" fill="#61AFEF" class="body-text" font-size="10">Avg Latency: <tspan fill="#98C379">&lt;1.5ms</tspan></text>
    <text x="290" y="13" fill="#61AFEF" class="body-text" font-size="10">Cache Hit Ratio: <tspan fill="#00C9FF">99.4%</tspan></text>
    <text x="475" y="13" fill="#61AFEF" class="body-text" font-size="10">Throughput: <tspan fill="#FF007A">10k+ req/s</tspan></text>
    <text x="680" y="13" fill="#E5C07B" class="body-text" font-size="10">Zero Data Loss ✔</text>
  </g>
</svg>
